name: SimWatchdog
options:
  bundleIdPrefix: com.endlessaitools
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    DEVELOPMENT_TEAM: XJG7H97W7D
    SWIFT_VERSION: "5.0"
targets:
  SimWatchdog:
    type: application
    platform: macOS
    sources:
      - path: ../Sources
      - path: ../Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleName: SimWatchdog
        CFBundleDisplayName: SimWatchdog
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "MIT License. Source: github.com/qwomg/SimWatchdog"
    entitlements:
      path: SimWatchdog.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # SimWatchdog's one job is to see and close simulator processes when memory runs low. The App Sandbox
        # blocks listing and signalling other processes, so these narrow temporary exceptions are required.
        com.apple.security.temporary-exception.sbpl:
          - "(allow process-info*)"
          - "(allow signal (target others))"
          - "(allow sysctl-read)"
          - "(allow mach-lookup (global-name \"com.apple.sysmond\"))"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.endlessaitools.simwatchdog
        PRODUCT_NAME: SimWatchdog
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
